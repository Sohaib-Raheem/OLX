<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post an Ad - OLX Clone</title>
  <link rel="stylesheet" href="ad.css">
</head>
<body>

  

  <!-- Post Ad Form -->
  <section class="post-ad">
    <h2>Post Your Ad</h2>
    <form class="ad-form" id="adForm" onsubmit="adInfo(event)">

      <!-- Title -->
      <label for="title">Ad Title *</label>
      <input type="text" id="title" placeholder="Enter title for your ad" required>

      <!-- Description -->
      <label for="desc">Description *</label>
      <textarea id="desc" rows="5" placeholder="Describe your product..." required></textarea>

      <!-- Category -->
      <label for="category">Category *</label>
      <select id="category" required>
        <option value="">Select Category</option>
        <option value="mobiles">Mobiles</option>
        <option value="cars">Cars</option>
        <option value="motorcycles">Motorcycles</option>
        <option value="houses">Houses</option>
        <option value="electronics">Electronics</option>
        <option value="jobs">Jobs</option>
      </select>

      <!-- Price -->
      <label for="price">Price (Rs) *</label>
      <input type="number" id="price" placeholder="Enter price" required>

      <!-- Location -->
      <label for="location">Location *</label>
      <input type="text" id="location" placeholder="Enter your city/area" required>

      <!-- Upload Images -->
      <label for="images">Upload Images *</label>
      <input type="file" id="images" multiple accept="image/*" required>

      <!-- Submit Button -->
      <input type="submit" class="submit-btn" value="Post Ad">
    </form>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 OLX Clone by Sohaib</p>
  </footer>

  <script src="ad.js"></script>


</body>
</html>
